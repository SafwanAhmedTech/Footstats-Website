{% extends "layout.html" %}

{% block body %}

<h1>Premier League Results</h1>

{% for match in matches %}

{% if match.status == "FINISHED" %}

<div class="fixture-card">

    <h2>
        {{ match.homeTeam.name }}
        {{ match.score.fullTime.home }}
        -
        {{ match.score.fullTime.away }}
        {{ match.awayTeam.name }}
    </h2>

</div>

{% endif %}

{% endfor %}

{% endblock %}
